name: PR preview (Cloudflare Pages)

# Builds every pull request and deploys it to its own Cloudflare Pages preview URL
# (https://pr-<number>.<project>.pages.dev). Production stays on GitHub Pages (deploy.yml).
#
# One-time setup, see README ("PR previews"): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets, optionally a CLOUDFLARE_PAGES_PROJECT repository variable.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'kinesis' }}

jobs:
  preview:
    # Secrets are not available to PRs from forks, so only run for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-dirty=true

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- pr-preview -->'
            const body = `${marker}\n🚀 **Preview:** ${process.env.URL}\n\nLatest commit: \`${process.env.SHA.slice(0, 7)}\`. Previews use their own origin, so test data stays separate from the real app.`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      # Record a GitHub deployment so the PR's "View deployment" button links to the preview.
      - name: Register GitHub deployment
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: process.env.SHA,
              environment: `preview-pr-${context.issue.number}`,
              description: 'Cloudflare Pages preview',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
            })
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: process.env.URL,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            })

      # Run the Playwright suite against the deployed preview. A failure fails the PR check.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for the preview to respond
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$URL"; then exit 0; fi
            echo "waiting for $URL ($i/30)"; sleep 10
          done
          echo "Preview never became reachable" >&2; exit 1

      - name: E2E against the preview
        env:
          BASE_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: npm run e2e

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Forks have no secrets, so no preview is deployed: run the same suite against a local `vite preview`.
  e2e-local:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e # builds and serves locally (see playwright.config.ts)
      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: |
            playwright-report/
            test-results/
          retention-days: 14
