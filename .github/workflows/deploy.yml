name: Deploy to Cloudflare Pages

# Production: every push to main is built and deployed to the Cloudflare Pages project's
# production branch (served on its custom domain). PRs get previews via preview.yml.
# Setup: see README ("Deploy").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Served from the root of the custom domain, so no BASE_PATH.
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'kinesis' }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
