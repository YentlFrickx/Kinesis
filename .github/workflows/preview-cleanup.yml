name: PR preview cleanup (Cloudflare Pages)

# When a pull request is closed (merged or not), delete its Cloudflare Pages preview deployments
# (branch pr-<number>, see preview.yml) and its GitHub deployment environment.
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as preview.yml.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  deployments: write

env:
  PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'kinesis' }}
  BRANCH: pr-${{ github.event.pull_request.number }}

jobs:
  cleanup:
    # Fork PRs never got a preview (no secrets), so there is nothing to delete.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Cloudflare Pages preview deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          auth="Authorization: Bearer $CF_API_TOKEN"

          # Collect every preview deployment for this PR's branch (paginated).
          ids=""
          page=1
          while :; do
            res=$(curl -fsS -H "$auth" "$api?env=preview&per_page=25&page=$page")
            ids+=$(echo "$res" | jq -r --arg b "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')$'\n'
            count=$(echo "$res" | jq '.result | length')
            [ "$count" -lt 25 ] && break
            page=$((page + 1))
          done

          ids=$(echo "$ids" | sed '/^$/d')
          if [ -z "$ids" ]; then echo "No deployments found for $BRANCH"; exit 0; fi

          # force=true is required to delete the deployment an alias (pr-<n>.<project>.pages.dev) points at.
          for id in $ids; do
            echo "Deleting deployment $id"
            curl -fsS -X DELETE -H "$auth" "$api/$id?force=true" -o /dev/null
          done

      # Remove the GitHub deployments registered by preview.yml so the PR doesn't keep a stale "active" environment.
      - name: Delete GitHub deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const environment = `preview-pr-${context.issue.number}`
            const deployments = await github.paginate(github.rest.repos.listDeployments, { owner, repo, environment })
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: d.id, state: 'inactive' })
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id })
            }
            console.log(`Removed ${deployments.length} GitHub deployment(s) for ${environment}`)
